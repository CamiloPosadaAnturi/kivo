{% extends 'base.html' %}
{% block title %}Eliminar Categoría{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-red-100 p-6 text-center">
    <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-exclamation-triangle text-red-500 text-2xl"></i>
    </div>
    <h2 class="text-xl font-bold text-kivo-oscuro mb-2">¿Eliminar categoría?</h2>
    <p class="text-kivo-gris mb-6">¿Estás seguro de que deseas eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="flex justify-center gap-3">
            <a href="{% url 'inventory:category_list' %}" class="border border-kivo-azul-claro text-kivo-pizarra px-6 py-2 rounded-xl text-sm font-medium hover:bg-gray-50">Cancelar</a>
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-xl text-sm font-medium transition-colors">Eliminar</button>
        </div>
    </form>
</div>
{% endblock %}

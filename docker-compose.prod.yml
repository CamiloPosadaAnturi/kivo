# Kivo en un servidor propio (VPS). Solo hace falta si despliegas por tu cuenta;
# en Railway o Render no se usa este archivo, la plataforma corre el Dockerfile.
#
#   cp .env.example .env    y llenas las variables de producción
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f web
#
# Caddy va delante para el HTTPS: pide y renueva el certificado solo, sin que
# tengas que pelear con certbot. Apunta tu dominio al servidor antes de subirlo.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - media:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: always

volumes:
  datos_postgres:
  media:
  caddy_data:
  caddy_config:
